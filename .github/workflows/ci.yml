
name: CloudOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run security tests
        env:
          UPLOAD_API_TOKEN: ci-test-token
          AWS_DEFAULT_REGION: ap-southeast-2
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m unittest discover -s tests -v

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t cloudops-backend:ci .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile -t cloudops-web:ci .



  terraform-check:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: terraform-vpc-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise providers without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color
