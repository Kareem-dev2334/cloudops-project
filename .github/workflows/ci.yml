
name: CloudOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run security tests
        env:
          UPLOAD_API_TOKEN: ci-test-token
          AWS_DEFAULT_REGION: ap-southeast-2
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m unittest discover -s tests -v

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t cloudops-backend:ci .

      - name: Verify backend container user
        run: |
          container_uid=$(docker run --rm cloudops-backend:ci id -u)
          test "$container_uid" = "10001"

      - name: Run security tests inside backend image
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=16m \
            --tmpfs /home/appuser:rw,nosuid,size=4m,uid=10001,gid=10001 \
            -e UPLOAD_API_TOKEN=ci-test-token \
            -e AWS_DEFAULT_REGION=ap-southeast-2 \
            -e AWS_EC2_METADATA_DISABLED=true \
            -v "$PWD/tests:/app/tests:ro" \
            cloudops-backend:ci \
            python -m unittest discover -s tests -v

      - name: Check backend startup and shutdown
        timeout-minutes: 2
        run: |
          set -euo pipefail
          trap 'docker logs backend-smoke; docker rm -f backend-smoke' EXIT

          docker run -d --name backend-smoke \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=16m \
            --tmpfs /home/appuser:rw,nosuid,size=4m,uid=10001,gid=10001 \
            -p 127.0.0.1:5050:5000 \
            -e AWS_DEFAULT_REGION=ap-southeast-2 \
            -e AWS_EC2_METADATA_DISABLED=true \
            -e USERS_API_TOKEN=ci-test-token \
            cloudops-backend:ci

          ready=false
          for attempt in {1..30}; do
            if health_body=$(curl -fsS --max-time 2 http://127.0.0.1:5050/health); then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

          printf '%s' "$health_body" | python -c \
            'import json, sys; assert json.load(sys.stdin)["status"] == "healthy"'

          users_status=$(curl -sS --max-time 5 -o /dev/null \
            -w '%{http_code}' http://127.0.0.1:5050/users)
          test "$users_status" = "401"

          docker stop --timeout 30 backend-smoke
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' backend-smoke)
          test "$exit_code" = "0"

      - name: Build frontend Docker image
        run: docker build -f Dockerfile -t cloudops-web:ci .

      - name: Build ECS frontend Docker image
        run: |
          docker build -f Dockerfile \
            --build-arg NGINX_CONFIG=default.ecs.conf \
            -t cloudops-web:ecs-ci .

      - name: Validate ECS Nginx configuration
        run: docker run --rm cloudops-web:ecs-ci nginx -t


  terraform-check:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: terraform-vpc-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise providers without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color
